[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spotify-creators-uploader"
version = "0.1.0"
description = "Unofficial headless-Playwright CLI for uploading video podcast episodes to Spotify for Creators."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jayashakthi Vishnu P" }]
keywords = [
    "spotify",
    "spotify-for-creators",
    "podcast",
    "video-podcast",
    "upload",
    "playwright",
    "automation",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/Jayashakthi28/spotify-creators-uploader"
Repository = "https://github.com/Jayashakthi28/spotify-creators-uploader"
Issues = "https://github.com/Jayashakthi28/spotify-creators-uploader/issues"
Changelog = "https://github.com/Jayashakthi28/spotify-creators-uploader/blob/main/CHANGELOG.md"

[project.scripts]
spotify-uploader = "spotify_uploader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spotify_uploader"]

[tool.hatch.build.targets.sdist]
include = [
    "src/spotify_uploader",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
